name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: byte-compile
        run: python -m compileall -q imefuse tests
      - name: detection runs on a clean machine
        run: python -m imefuse.cli detect
