name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: unit tests
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: byte-compile
        run: python -m compileall -q imefuse tests
      - name: entry script parses and reports usage
        run: |
          bash -n imefuse.sh
          ./imefuse.sh --help >/dev/null
          ./imefuse.sh version
      - name: detection runs on a clean machine
        # 干净 CI 机器上三个输入法都不存在，必须仍然退出 0 并说清楚原因
        run: |
          ./imefuse.sh --python "$(command -v python3)" detect
          ./imefuse.sh --python "$(command -v python3)" doctor || true
