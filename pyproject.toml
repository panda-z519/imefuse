[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imefuse"
version = "0.1.0"
description = "Export, merge and migrate personal word-frequency data between macOS Chinese input methods (WeType / Sogou / Doubao)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "imefuse contributors" }]
keywords = ["ime", "input-method", "macos", "pinyin", "dictionary", "wetype", "sogou", "doubao"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Text Input",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
imefuse = "imefuse.cli:main"

[project.urls]
Homepage = "https://github.com/your-name/imefuse"
Issues = "https://github.com/your-name/imefuse/issues"

[tool.setuptools]
packages = ["imefuse", "imefuse.leveldb", "imefuse.adapters", "imefuse.gui"]

[tool.setuptools.package-data]
"imefuse.gui" = ["static/*"]
