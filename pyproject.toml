[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imefuse"
version = "0.1.0"
description = "Export, merge and migrate personal word-frequency data between macOS Chinese input methods (WeType / Sogou / Doubao)"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["ime", "input-method", "macos", "pinyin", "dictionary", "wetype", "sogou", "doubao"]
authors = [{ name = "imefuse contributors" }]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Topic :: Text Input",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
imefuse = "imefuse.cli:main"

[project.urls]
Homepage = "https://github.com/your-name/imefuse"
Issues = "https://github.com/your-name/imefuse/issues"

[tool.setuptools]
# 显式列出，避免 setuptools 自动发现把 build/、exports/ 之类扫进来
packages = ["imefuse", "imefuse.leveldb", "imefuse.adapters", "imefuse.gui"]
include-package-data = false

[tool.setuptools.package-data]
# 界面是纯静态文件，不是 Python 包，只能靠 package-data 带进 wheel
"imefuse.gui" = ["static/*"]
